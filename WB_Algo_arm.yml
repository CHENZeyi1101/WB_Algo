      - markdown-it-py==4.0.0
      - mdurl==0.1.2
      - namex==0.1.0
      - numpy==2.4.2
      - pkgconfig==1.5.5
      - protobuf==6.33.5
      - rich==14.2.0
      - seaborn==0.13.2
      - tabulate==0.9.0
      - tensorboard==2.20.0
