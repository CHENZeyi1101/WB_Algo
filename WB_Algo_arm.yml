name: WB_Algo_arm
channels:
  - conda-forge
  - gurobi
  - defaults
dependencies:
  - python=3.11

  # Core scentific stack
  - numpy = 1.24.4
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - h5py
  - tqdm

  # Optimal transport
  - pot
  - ott-jax
  - jax
  - jaxlib

  # PyTorch (ARM-safe via conda-forge)
  - pytorch
  - torchvision
  - torchaudio

  # Dev /notebooks
  - ipython
  - ipywidgets
  - ipykernel

  # Utilities
  - wandb

  # Tensorflow
