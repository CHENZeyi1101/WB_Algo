name: WB_Algo_arm
channels:
  - conda-forge
  - gurobi
  - defaults

dependencies:
  - python=3.11

  # Core scientific stack
  - numpy=1.24.4
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - h5py
  - tqdm

  # Optimal transport
  - pot
  - ott-jax
  - jax
  - jaxlib

  # PyTorch (ARM-safe via conda-forge)
  - pytorch
  - torchvision
  - torchaudio

  # TensorFlow (Apple Silicon compatible via conda-forge)
  - tensorflow
  - keras
  - tensorboard
  - protobuf
  - grpcio
  - absl-py
  - astunparse
  - flatbuffers
  - opt-einsum
  - gast
  - libclang
  - wrapt

  # Dev / notebooks
  - ipython
  - ipywidgets
  - ipykernel

  # Utilities
  - wandb